[project]
name = "bug-archaeology"
version = "0.1.0"
description = "Retrieval over a repository's full history — answers why code is the way it is."
requires-python = ">=3.11"

dependencies = [
    # ingestion
    "GitPython>=3.1.43",
    "httpx>=0.27.0",
    # indexing + retrieval
    "rank-bm25>=0.2.2",
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    # generation
    "anthropic>=0.40.0",
    # plumbing
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    # parsing (Phase 0 decision, specific #3): tree-sitter + the official
    # tree-sitter-python grammar binding. NOT tree-sitter-languages — it pins
    # an old tree-sitter core and is unmaintained against current releases.
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.39.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
